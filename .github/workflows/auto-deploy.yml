name: Daily Macro Data Auto Refresh & Deploy

on:
  schedule:
    # 毎日 日本時間 午前8:00 (UTC 23:00) に自動実行
    - cron: '0 23 * * *'
  # GitHub上のActionsタブからいつでも手動実行（ワンクリック即時更新）可能
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js & Refresh Static Data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      - name: Commit & Push if any changes / Trigger Vercel Auto-deploy
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): daily automated macro data refresh [skip ci]" && git push)
