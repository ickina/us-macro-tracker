name: Daily Macro Data Auto Refresh & Deploy

on:
  schedule:
    # 毎日 日本時間 午前8:00 (UTC 23:00) および 日本時間 午後22:00 (UTC 13:00) の1日2回自動更新
    - cron: '0 23 * * *'
    - cron: '0 13 * * *'
  # GitHub上のActionsタブからいつでも手動実行（ワンクリック即時更新）可能
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch Official Macro Data
        run: node scripts/fetch-macro-data.mjs

      - name: Build Next.js & Sync Capacitor
        run: |
          npm run build
          npx cap sync

      - name: Commit & Push if any changes (Triggers Vercel Deployment)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/macroData.json android/ ios/
          git diff --staged --quiet || (git commit -m "chore(data): auto-refresh official macro data" && git push origin main)
